[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vivideo"
version = "0.1.0"
description = "A conversational, space-isolated local video discovery service"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "playwright>=1.50,<2"]

[project.scripts]
vivideo = "vivideo.cli:main"
vivideo-export-memories = "vivideo.export_memories:main"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["vivideo*"]
namespaces = false

[tool.setuptools.package-data]
vivideo = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
